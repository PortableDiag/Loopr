plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

def keystorePropertiesFile = rootProject.file("keystore.properties")
def keystoreProperties = new Properties()
if (keystorePropertiesFile.exists()) {
    keystorePropertiesFile.withInputStream { keystoreProperties.load(it) }
}

android {
    namespace 'com.loopr.player'
    compileSdk 35

    defaultConfig {
        applicationId "com.loopr.player"
        minSdk 26
        targetSdk 35
        versionCode 23
        versionName "1.19"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        // Filament is the only native code. 64-bit ARM is every phone Loopr runs on, x86_64 the
        // emulator; without these two each 3D model says so instead of crashing.
        ndk { abiFilters 'arm64-v8a', 'x86_64' }
    }

    signingConfigs {
        release {
            if (keystoreProperties['storeFile']) {
                storeFile file("${project.rootDir}/${keystoreProperties['storeFile']}")
                storePassword keystoreProperties['storePassword']
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
            }
        }
    }

    buildTypes {
        release {
            if (keystoreProperties['storeFile']) {
                signingConfig signingConfigs.release
            }
            minifyEnabled false
            shrinkResources false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
    buildFeatures {
        viewBinding true
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.activity:activity-ktx:1.8.2'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'

    // Media3 / ExoPlayer
    implementation 'androidx.media3:media3-exoplayer:1.4.1'
    implementation 'androidx.media3:media3-ui:1.4.1'
    implementation 'androidx.media3:media3-common:1.4.1'

    // 3D models (VRM, glTF, GLB): Google's Filament renderer and its glTF loader. Native code,
    // shipped only for the two ABIs Loopr is run on (see ndk.abiFilters).
    implementation 'com.google.android.filament:filament-android:1.56.0'
    implementation 'com.google.android.filament:gltfio-android:1.56.0'

    // Coroutines for async thumbnail loading
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'

    // The local API's routing, auth and error shapes run on the JVM against a fake backend. The
    // android.jar unit tests compile against stubs org.json with methods that throw; the real one,
    // earlier on the test classpath, is what lets the API's JSON be exercised at all.
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20231013'

    // Instrumented tests. A floating window is an overlay drawn by a service, so the only way to
    // exercise its pinch-resize is to inject real multi-pointer events on a device.
    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'androidx.test:rules:1.6.1'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
}
